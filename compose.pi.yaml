name: opengym
services:
  api:
    image: opengym-api:coaching
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    build:
      context: .
      dockerfile: api/Dockerfile.mcp
    environment:
      DATA_DIR: /data
      PORT: 3000
      RP_ID: ${OPENGYM_HOSTNAME:-localhost}
      ORIGIN: ${OPENGYM_ORIGIN:-http://localhost:8090}
      MCP_ENABLED: '1'
      MCP_ORIGIN: ${OPENGYM_MCP_ORIGIN:-${OPENGYM_ORIGIN:-http://localhost:8090}}
      # Exact callbacks only: existing ChatGPT connector and local n8n OAuth.
      # Approved and applied 2026-11-02 via opengym-n8n-oauth.yml.
      MCP_REDIRECT_URIS: "https://chatgpt.com/connector_platform_oauth_redirect,http://localhost:5678/rest/oauth2-credential/callback"
      TZ: Europe/London
      ALLOW_GUEST: '0'
      FIRST_USER_ADMIN: '1'
      PASSWORD_LOGIN: ${OPENGYM_PASSWORD_LOGIN:-0}
      INVITE_ONLY: ${OPENGYM_INVITE_ONLY:-0}
      TRUST_PROXY: '1'
    volumes:
      - ./data:/data
    restart: unless-stopped
    mem_limit: 384m
    cpus: 1.0
  web:
    image: opengym-web:coaching
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      NGINX_PORT: 80
      BACKEND: api
      PORT: 3000
      RESOLVER: 127.0.0.11
      BASE_PATH: ''
      CF_CONNECTING_IP: ''
      MEDIA_UPLOAD_MAX: 48m
    ports:
      - '${OPENGYM_BIND_ADDRESS:-127.0.0.1}:8090:80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.5
